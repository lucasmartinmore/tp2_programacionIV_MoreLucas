<!-- Favicon propio: un plato visto desde arriba. viewBox define un lienzo de 64x64 que se escala a cualquier tamaño -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Borde exterior del plato: círculo naranja (cx/cy = centro, r = radio, fill = color de relleno) -->
  <circle cx="32" cy="32" r="30" fill="#e8590c"/>
  <!-- Centro del plato: círculo crema más chico -->
  <circle cx="32" cy="32" r="18" fill="#fff8f0"/>
  <!-- La comida: círculo amarillo en el medio -->
  <circle cx="32" cy="32" r="11" fill="#fcc419"/>
</svg>
<nav class="navbar navbar-expand-md navbar-dark navbar-morfi">
  <div class="container">
    <a class="navbar-brand" routerLink="/publicaciones">Morfi</a>

    <!-- Botón hamburguesa: solo se ve en pantallas chicas. Alterna la señal menuAbierto -->
    <button class="navbar-toggler" type="button" aria-label="Abrir menú"
            (click)="menuAbierto.set(!menuAbierto())">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- [class.show]: en pantallas chicas el menú se despliega cuando menuAbierto() es true -->
    <div class="collapse navbar-collapse" [class.show]="menuAbierto()">
      <!-- (click) en la lista: al tocar cualquier link se cierra el menú -->
      <ul class="navbar-nav ms-auto align-items-md-center" (click)="menuAbierto.set(false)">
        <!-- Link a Publicaciones. routerLinkActive="active" = le agrega la clase "active" si es la pantalla actual -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/publicaciones" routerLinkActive="active">Publicaciones</a>
        </li>
        <!-- Link a Mi perfil (igual que el anterior) -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/mi-perfil" routerLinkActive="active">Mi perfil</a>
        </li>

        <!-- *appSoloAdmin: directiva propia; estos links solo existen en el HTML si el usuario es administrador -->
        <li class="nav-item" *appSoloAdmin>
          <a class="nav-link" routerLink="/dashboard/usuarios" routerLinkActive="active">Usuarios</a>
        </li>
        <li class="nav-item" *appSoloAdmin>
          <a class="nav-link" routerLink="/dashboard/estadisticas" routerLinkActive="active">Estadísticas</a>
        </li>

        <!-- @if: si auth.usuario() tiene un usuario (hay sesión) mostramos "Salir"; si es null, el bloque @else -->
        @if (auth.usuario()) {
          <li class="nav-item ms-md-2">
  <!-- title y aria-label: el texto que aparece al pasar el mouse y que leen los lectores de pantalla -->
  <button class="btn-salir" (click)="salir()" title="Cerrar sesión" aria-label="Cerrar sesión">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  </button>
</li>
        } @else {
          <!-- Sin sesión: link al login -->
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Ingresar</a>
          </li>
          <!-- Sin sesión: link al registro -->
          <li class="nav-item">
            <a class="nav-link" routerLink="/registro" routerLinkActive="active">Registrarse</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>

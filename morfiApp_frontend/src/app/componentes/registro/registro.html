<div class="container py-4">
  <div class="row justify-content-center">
    <!-- Ancho de la tarjeta en pantallas grandes -->
    <div class="col-lg-8">
      <!-- Tarjeta con nuestro estilo (bordes redondeados y sombra) -->
      <div class="card tarjeta">
        <div class="card-body p-4">
          <!-- Título de la pantalla -->
          <h2 class="titulo">Creá tu cuenta</h2>

          <!-- Formulario compartido: [enviando] le dice si hay que bloquear el botón; (enviado) llega con el FormData listo -->
          <app-formulario-usuario [enviando]="enviando()" (enviado)="enviar($event)" />

          <!-- routerLink="/login" = lleva al login sin recargar la página -->
          <p class="text-center mt-3 mb-0">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

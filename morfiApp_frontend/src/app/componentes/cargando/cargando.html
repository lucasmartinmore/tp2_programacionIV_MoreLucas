<!-- Pantalla de carga: logo + nombre + spinner, centrados en la pantalla -->
<div class="pantalla-carga">
  <!-- Logo dibujado con SVG  currentColor toma el color del contenedor -->
  <svg class="logo" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
    <!-- Plato -->
    <circle cx="60" cy="60" r="34" fill="none" stroke="currentColor" stroke-width="5" />
    <circle cx="60" cy="60" r="22" fill="none" stroke="currentColor" stroke-width="3" opacity="0.5" />
    <!-- Tenedor (izquierda): tres puntas y mango -->
    <path d="M14 30 v22 M20 30 v22 M26 30 v22 M14 52 q6 8 12 0 M20 52 v38" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
    <!-- Cuchillo (derecha): hoja y mango -->
    <path d="M104 30 q10 14 0 34 v26" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </svg>

  <!-- Nombre de la app -->
  <h1 class="nombre">Morfi</h1>

  <!-- Spinner de Bootstrap; role="status" por accesibilidad -->
  <div class="spinner-border spinner" role="status"></div>

  <!-- Texto de estado -->
  <p class="texto">Preparando tus recetas...</p>
</div>
